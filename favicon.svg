<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paddleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7C948;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Paddle Handle -->
  <rect x="14" y="20" width="4" height="8" fill="#8B4513" rx="1"/>
  <rect x="13" y="18" width="6" height="4" fill="#D2691E" rx="1"/>
  
  <!-- Paddle Face -->
  <ellipse cx="16" cy="12" rx="7" ry="9" fill="url(#paddleGradient)" filter="url(#shadow)" stroke="#D4AF37" stroke-width="0.5"/>
  
  <!-- Paddle Grip Lines -->
  <line x1="14.5" y1="22" x2="17.5" y2="22" stroke="#654321" stroke-width="0.3"/>
  <line x1="14.5" y1="24" x2="17.5" y2="24" stroke="#654321" stroke-width="0.3"/>
  <line x1="14.5" y1="26" x2="17.5" y2="26" stroke="#654321" stroke-width="0.3"/>
  
  <!-- Dinkaling Logo Text -->
  <text x="16" y="10" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#2C3E50" text-anchor="middle">D</text>
  <text x="16" y="13" font-family="Arial, sans-serif" font-size="2.5" font-weight="bold" fill="#2C3E50" text-anchor="middle">D</text>
  
  <!-- Small pickleball in corner -->
  <circle cx="22" cy="8" r="1.5" fill="white" stroke="#F39C12" stroke-width="0.3"/>
  <path d="M 21.2 8 Q 22 7.2 22.8 8 M 21.2 8 Q 22 8.8 22.8 8" stroke="#F39C12" stroke-width="0.2" fill="none"/>
</svg>
